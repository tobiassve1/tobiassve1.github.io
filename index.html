      en:{lang:'Language',privacy:'Privacy policy',copyright:'© 2026 Tobias Mads Svendsen. All rights reserved.',eyebrow:'A calmer way away from snus',title:'Your next good choice starts today.',intro:'Stop Snus helps you understand your consumption, follow your goals and stay with your decision — one day at a time.',download:'Get it on the App Store',howEyebrow:'How it works',howTitle:'A tool for everyday life — not a control panel.',howIntro:'Stop Snus makes the next choice clear, even when cravings are strong or the day does not go as planned.',cards:[['01','Choose your path','Start with a snus-free journey or follow a gradual plan that fits your starting point.'],['02','See the day clearly','Track your consumption, follow your progress and get a calm overview of your next step.'],['03','Move forward','Use practical tools for cravings or a slip, and continue without guilt or shame.']],privacyEyebrow:'Privacy first',privacyTitle:'Your quit journey stays on your device.',privacyText:'Stop Snus stores plans, records and other journey data locally on your phone or tablet. We have no server that syncs your journal, so data does not follow you to another device. Apple or Google is used for sign-in, while RevenueCat — when subscriptions are enabled — handles only subscription identity and purchases.',read:'Read the full privacy policy.',ready:'Ready to begin?',readyTitle:'Take the next good choice with you.',readyText:'Download Stop Snus and start building a journey that fits you.'},

      sv:{lang:'Språk',privacy:'Integritetspolicy',copyright:'© 2026 Tobias Mads Svendsen. Alla rättigheter förbehållna.',eyebrow:'En lugnare väg bort från snus',title:'Ditt nästa goda val börjar idag.',intro:'Stop Snus hjälper dig att förstå din konsumtion, följa dina mål och hålla fast vid ditt beslut — en dag i taget.',download:'Hämta på App Store',howEyebrow:'Så fungerar det',howTitle:'Ett verktyg för vardagen — inte en kontrollpanel.',howIntro:'Stop Snus gör nästa val tydligt, även när suget är starkt eller dagen inte går enligt plan.',cards:[['01','Välj din väg','Börja en snusfri resa eller följ en gradvis plan som passar din utgångspunkt.'],['02','Se dagen klart','Registrera konsumtionen, följ utvecklingen och få överblick över nästa steg.'],['03','Gå vidare','Använd konkreta verktyg vid sug eller återfall och fortsätt utan skam.']],privacyEyebrow:'Integritet först',privacyTitle:'Din sluta-snusa-resa stannar på din enhet.',privacyText:'Stop Snus lagrar planer, registreringar och andra uppgifter lokalt på din mobil eller surfplatta. Vi har ingen server som synkroniserar din dagbok. Apple eller Google används för inloggning, medan RevenueCat vid aktiva abonnemang endast hanterar abonnemangsidentitet och köp.',read:'Läs hela integritetspolicyn.',ready:'Redo att börja?',readyTitle:'Ta med dig nästa goda val.',readyText:'Ladda ner Stop Snus och börja en resa som passar dig.'}

    function render(lang='en'){const t=sale[lang]||sale.en;document.documentElement.lang=lang;document.title=t.title+' – Stop Snus';document.getElementById('language-label').textContent=t.lang;document.getElementById('privacy-link').textContent=t.privacy;document.getElementById('footer-privacy').textContent=t.privacy;document.getElementById('copyright').textContent=t.copyright;document.getElementById('content').innerHTML='<section class="hero" aria-labelledby="hero-title"><div><p class="eyebrow">'+t.eyebrow+'</p><h1 id="hero-title">'+t.title+'</h1><p class="hero-copy">'+t.intro+'</p><div class="actions"><a class="button button-primary" href="https://apps.apple.com/dk/app/stop-snus/id6737152369?l=da">'+t.download+'</a></div></div><aside class="hero-card"><span class="small">'+t.privacyEyebrow+'</span><strong>'+t.cards[0][1]+'.<br>'+t.cards[2][1]+'.</strong><span class="small">'+t.privacyText.split('.')[0]+'.</span></aside></section><section id="how" class="section" aria-labelledby="how-title"><p class="eyebrow">'+t.howEyebrow+'</p><h2 id="how-title">'+t.howTitle+'</h2><p class="section-intro">'+t.howIntro+'</p><div class="grid">'+t.cards.map(c=>'<article class="card"><div class="number">'+c[0]+'</div><h3>'+c[1]+'</h3><p>'+c[2]+'</p></article>').join('')+'</div></section><section class="section"><div class="privacy-box"><p class="eyebrow">'+t.privacyEyebrow+'</p><h2>'+t.privacyTitle+'</h2><p>'+t.privacyText+' <a href="https://tobiassve1.github.io/stopsnus1/">'+t.read+'</a></p></div></section><section class="section"><p class="eyebrow">'+t.ready+'</p><h2>'+t.readyTitle+'</h2><p class="section-intro">'+t.readyText+'</p><div class="actions"><a class="button button-primary" href="https://apps.apple.com/dk/app/stop-snus/id6737152369?l=da">'+t.download+'</a></div></section>';}
