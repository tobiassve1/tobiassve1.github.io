    const play='<svg aria-hidden="true" viewBox="0 0 24 28"><path d="M3 2v24l19-12L3 2Z"/></svg>';
    function storeButtons(c){const android=/Android/i.test(navigator.userAgent),ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);return '<div class="actions">'+[['ios',apple,'App Store','iPhone / iPad',ios],['android',play,'Google Play','Android',android]].map(([key,icon,name,device,preferred])=>'<a class="store'+(preferred?' preferred':'')+'" href="'+stores[key]+'" aria-label="'+c[2]+' '+device+' — '+name+'">'+icon+'<span><small>'+device+'</small><strong style="white-space:nowrap">'+name+'</strong></span></a>').join('')+'</div>';}
    function render(lang='da'){
      if(!sale[lang])lang='da';
      const t=sale[lang],c=productCopy[lang];
      document.documentElement.lang=lang;document.title=c[0]+' — Stop Snus';
      document.querySelector('meta[name="description"]').content=c[1];
      document.getElementById('language-select').value=lang;
      document.getElementById('language-label').textContent=t.lang;
      document.getElementById('language-select').setAttribute('aria-label',t.lang);
      document.getElementById('privacy-link').textContent=t.privacy;
      document.getElementById('footer-privacy').textContent=t.privacy;
      document.getElementById('copyright').textContent=t.copyright;
      const legal=document.querySelector('.legal').querySelectorAll('a');legal[0].textContent=c[24];legal[1].textContent=c[25];
      document.getElementById('content').innerHTML=`
        <section class="hero" aria-labelledby="hero-title">
          <div><p class="eyebrow">Stop Snus · iOS & Android</p><h1 id="hero-title">${c[0]}</h1><p class="hero-copy">${c[1]}</p>${storeButtons(c)}</div>
          <div class="preview live-preview">${StopSnusDemo.markup(lang)}</div>
        </section>
        <div class="strip"><span>${c[4]}</span><span>${c[5]}</span><span>${c[6]}</span></div>
        <section id="how" class="section" aria-labelledby="how-title"><p class="eyebrow">${t.howEyebrow}</p><h2 id="how-title">${c[7]}</h2><div class="feature-grid">
          ${[['hero.png',8,9],['money_saved_page.png',10,11],['actions_to_keep_mind_from_snus.png',12,13]].map(([src,title,body],i)=>`<article class="feature"><div class="feature-copy"><span class="feature-number">0${i+1}</span><h3>${c[title]}</h3><p>${c[body]}</p></div><div class="feature-visual"><img src="assets/marketing/${src}" alt="${c[title]}" loading="lazy" width="${i===0?437:i===1?436:441}" height="${i===0?743:i===1?832:840}"></div></article>`).join('')}
        </div><p class="screen-note">${c[14]}</p></section>
        <section class="privacy-box" aria-labelledby="privacy-title"><div><p class="eyebrow">${t.privacyEyebrow}</p><h2 id="privacy-title">${t.privacyTitle}</h2></div><div><p>${t.privacyText}</p><a href="https://tobiassve1.github.io/stopsnus1/">${t.read} ↗</a></div></section>
        <section class="section faq" aria-labelledby="faq-title"><h2 id="faq-title">${c[15]}</h2>${[16,18,20].map(i=>`<details><summary>${c[i]}</summary><p>${c[i+1]}</p></details>`).join('')}</section>
        <section class="download-panel"><h2>${c[22]}</h2><p>${c[23]}</p>${storeButtons(c)}</section>`;
